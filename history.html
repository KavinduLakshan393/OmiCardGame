<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omi — My History</title>
    <meta name="description" content="View your Omi match history, rating, and overall statistics.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/typography.css">
    <link rel="stylesheet" href="styles/history.css">
</head>
<body class="history-page">
    <header class="history-topbar">
        <a class="history-back" href="main-menu.html" aria-label="Back to main menu">
            <span aria-hidden="true">←</span> Main Menu
        </a>
        <h1 class="history-page-title">My History</h1>
    </header>

    <main class="history-shell">

        <!-- Rating Card -->
        <section class="rating-card" aria-labelledby="rating-heading">
            <div class="rating-card-inner">
                <div class="rating-block">
                    <span class="rating-label" id="rating-heading">Rating</span>
                    <span class="rating-value" id="history-rating">—</span>
                </div>
                <div class="rating-sparkline-wrap">
                    <svg id="rating-sparkline" class="rating-sparkline" viewBox="0 0 200 48" aria-hidden="true" preserveAspectRatio="none"></svg>
                    <span class="sparkline-caption" id="sparkline-caption"></span>
                </div>
                <div class="rating-record">
                    <span class="record-wins" id="history-wins">0W</span>
                    <span class="record-sep">/</span>
                    <span class="record-losses" id="history-losses">0L</span>
                </div>
            </div>
        </section>

        <!-- Overall Stats -->
        <section class="history-section" aria-labelledby="stats-heading">
            <h2 class="history-section-title" id="stats-heading">Overall Statistics</h2>
            <div class="overall-stats-grid">
                <div class="stat-cell">
                    <span class="stat-cell-value" id="stat-total-matches">0</span>
                    <span class="stat-cell-label">Matches</span>
                </div>
                <div class="stat-cell">
                    <span class="stat-cell-value" id="stat-win-rate">—</span>
                    <span class="stat-cell-label">Win Rate</span>
                </div>
                <div class="stat-cell">
                    <span class="stat-cell-value" id="stat-kapothis-for">0</span>
                    <span class="stat-cell-label">Kapothis</span>
                </div>
                <div class="stat-cell">
                    <span class="stat-cell-value" id="stat-avg-duration">—</span>
                    <span class="stat-cell-label">Avg. Duration</span>
                </div>
            </div>
        </section>

        <!-- Match History Table -->
        <section class="history-section" aria-labelledby="history-heading">
            <h2 class="history-section-title" id="history-heading">Match History</h2>
            <div id="history-list" class="history-list">
                <p class="history-empty-state" id="history-empty">No matches played yet. <a href="game.html">Start a game!</a></p>
            </div>
        </section>

    </main>

    <script type="module" src="src/ui/history-page.js"></script>
</body>
</html>
