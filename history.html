<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omi — My History</title>
    <meta name="description" content="View your Omi match history, rating, and overall statistics.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/typography.css">
    <link rel="stylesheet" href="styles/menu.css">
    <link rel="stylesheet" href="styles/history.css">
</head>
<body class="history-page menu-page">
    <div class="history-bg-glow" aria-hidden="true"></div>

    <header class="history-topbar">
        <a class="menu-brand" href="main-menu.html" aria-label="Omi main menu">
            <span class="brand-wordmark">Omi</span>
            <span class="brand-suits" aria-hidden="true">♠ ♥ ♦ ♣</span>
        </a>
        <a class="history-back-btn" href="main-menu.html" aria-label="Back to main menu">
            <span aria-hidden="true">←</span> Main Menu
        </a>
    </header>

    <main class="history-shell">
        <div class="history-header">
            <div class="suit-crown" aria-hidden="true">
                <span>♠</span><span>♥</span><span>♦</span><span>♣</span>
            </div>
            <h1 class="history-title">My History</h1>
            <p class="history-subtitle">Match records, statistics &amp; player rating</p>
        </div>

        <!-- Rating Card -->
        <section class="rating-card" aria-labelledby="rating-heading">
            <div class="rating-card-inner">
                <div class="rating-block">
                    <span class="rating-label" id="rating-heading">Player Rating</span>
                    <span class="rating-value" id="history-rating">1000</span>
                </div>
                <div class="rating-sparkline-wrap">
                    <svg id="rating-sparkline" class="rating-sparkline" viewBox="0 0 200 48" aria-hidden="true" preserveAspectRatio="none"></svg>
                    <span class="sparkline-caption" id="sparkline-caption"></span>
                </div>
                <div class="rating-record">
                    <span class="record-badge record-badge--wins">
                        <span class="record-num" id="history-wins">0W</span>
                        <span class="record-lbl">Wins</span>
                    </span>
                    <span class="record-divider" aria-hidden="true">/</span>
                    <span class="record-badge record-badge--losses">
                        <span class="record-num" id="history-losses">0L</span>
                        <span class="record-lbl">Losses</span>
                    </span>
                </div>
            </div>
        </section>

        <!-- Overall Stats -->
        <section class="history-section" aria-labelledby="stats-heading">
            <h2 class="history-section-title" id="stats-heading">Overall Statistics</h2>
            <div class="overall-stats-grid">
                <div class="stat-cell">
                    <span class="stat-cell-value" id="stat-total-matches">0</span>
                    <span class="stat-cell-label">Matches</span>
                </div>
                <div class="stat-cell">
                    <span class="stat-cell-value" id="stat-win-rate">—</span>
                    <span class="stat-cell-label">Win Rate</span>
                </div>
                <div class="stat-cell">
                    <span class="stat-cell-value" id="stat-kapothis-for">0</span>
                    <span class="stat-cell-label">Kapothis</span>
                </div>
                <div class="stat-cell">
                    <span class="stat-cell-value" id="stat-avg-duration">—</span>
                    <span class="stat-cell-label">Avg. Duration</span>
                </div>
            </div>
        </section>

        <!-- Match History Table -->
        <section class="history-section" aria-labelledby="history-heading">
            <h2 class="history-section-title" id="history-heading">Recent Matches</h2>
            <div id="history-list" class="history-list">
                <div class="history-empty-state" id="history-empty">
                    <div class="empty-icon" aria-hidden="true">🂠</div>
                    <p class="empty-text">No matches played yet.</p>
                    <a class="empty-cta-btn" href="game.html">Start a Game</a>
                </div>
            </div>
        </section>

        <footer class="history-footer">
            <span>Single Player v1</span>
            <span>Standard Omi · 10 Token Match</span>
        </footer>
    </main>

    <script type="module" src="src/ui/history-page.js"></script>
</body>
</html>
